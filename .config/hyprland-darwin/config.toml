# HyprDarwin config, written by `hypr init`. Mod key = alt (Hyprland's SUPER).
# AeroSpace commands: https://nikitabobko.github.io/AeroSpace/commands
config-version = 2
start-at-login = true
auto-reload-config = true

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true
accordion-padding = 30
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
automatically-unhide-macos-hidden-apps = false
persistent-workspaces = ["1", "2", "3", "4", "9"]

[key-mapping]
    preset = 'qwerty'

# Hyprland: focus follows mouse
[focus-follows-mouse]
    enabled = true

# Hyprland: alt + drag moves a window
[mouse-drag]
    enabled = true
    modifier = 'alt'

# Leave room for the bar (40 px) on displays without a notch
[gaps]
    inner.horizontal = 10
    inner.vertical =   10
    outer.left =       14
    outer.bottom =     14
    outer.right =      14
    outer.top =        [{ monitor."built-in" = 14 }, 44]

[borders]
    enabled = true
    width = 4
    radius = 15
    active = 'gradient(0xff7aa2f7,0xffbb9af7)'
    inactive = '0x80414868'

[bar]
    enabled = true
    left = ['workspaces', 'chevron', 'front-app']
    right = ['disk', 'ram', 'gpu', 'cpu', 'network', 'volume', 'battery', 'clock']

[mode.main.binding]
    alt-enter = 'new-window-or-open Terminal'
    alt-b = 'new-window-or-open Safari'
    alt-e = 'new-window-or-open Finder'

    alt-v = 'layout floating tiling'
    alt-f = 'fullscreen'
    alt-shift-f = 'macos-native-fullscreen'
    alt-slash = 'layout tiles horizontal vertical'
    alt-comma = 'layout accordion horizontal vertical'
    alt-shift-equal = 'balance-sizes'

    alt-h = 'focus left'
    alt-j = 'focus down'
    alt-k = 'focus up'
    alt-l = 'focus right'
    alt-shift-h = 'move left'
    alt-shift-j = 'move down'
    alt-shift-k = 'move up'
    alt-shift-l = 'move right'

    alt-minus = 'resize smart -50'
    alt-equal = 'resize smart +50'
    alt-r = 'mode resize'

    alt-1 = 'workspace 1'
    alt-2 = 'workspace 2'
    alt-3 = 'workspace 3'
    alt-4 = 'workspace 4'
    alt-5 = 'workspace 5'
    alt-6 = 'workspace 6'
    alt-7 = 'workspace 7'
    alt-8 = 'workspace 8'
    alt-9 = 'workspace 9'
    alt-0 = 'workspace 10'
    alt-shift-1 = 'move-node-to-workspace 1'
    alt-shift-2 = 'move-node-to-workspace 2'
    alt-shift-3 = 'move-node-to-workspace 3'
    alt-shift-4 = 'move-node-to-workspace 4'
    alt-shift-5 = 'move-node-to-workspace 5'
    alt-shift-6 = 'move-node-to-workspace 6'
    alt-shift-7 = 'move-node-to-workspace 7'
    alt-shift-8 = 'move-node-to-workspace 8'
    alt-shift-9 = 'move-node-to-workspace 9'
    alt-shift-0 = 'move-node-to-workspace 10'

    # Hyprland "special workspace" (scratchpad)
    alt-s = 'workspace S'
    alt-shift-s = 'move-node-to-workspace S'

    alt-tab = 'workspace-back-and-forth'
    alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'
    alt-shift-semicolon = 'mode service'

# Hyprland-style resize submap
[mode.resize.binding]
    h = 'resize width -50'
    l = 'resize width +50'
    k = 'resize height -50'
    j = 'resize height +50'
    esc = 'mode main'
    enter = 'mode main'

[mode.service.binding]
    esc = ['reload-config', 'mode main']
    r = ['flatten-workspace-tree', 'mode main']
    f = ['layout floating tiling', 'mode main']
    backspace = ['close-all-windows-but-current', 'mode main']

# Float dialogs and utility apps (Hyprland windowrule float)
[[on-window-detected]]
    if.app-id = 'com.apple.systempreferences'
    run = 'layout floating'

[[on-window-detected]]
    if.app-id = 'com.apple.ActivityMonitor'
    run = 'layout floating'

[[on-window-detected]]
    if.app-id = 'com.apple.calculator'
    run = 'layout floating'
